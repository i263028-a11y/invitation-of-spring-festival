<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Spring Festival event invitation, activities, venue and RSVP information.">
<title>RSVP | Spring Festival</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Spring Festival</span></a>
<nav aria-label="Main navigation"><a href="index.html" class="">Home</a><a href="schedule.html" class="">Schedule</a><a href="venue.html" class="">Venue</a><a href="rsvp.html" class="active">RSVP</a></nav>
</header>
<main>
<section class="section">
<div class="section-heading center"><p class="eyebrow">Save your place</p><h1>Festival <span class="gold">RSVP</span></h1><p>Fill in this form to register your interest in attending the Spring Festival.</p></div>
<form class="form-card" id="rsvpForm">
<div class="form-grid">
<div><label for="name">Full name</label><input id="name" name="name" type="text" placeholder="Enter your full name" required></div>
<div><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="name@example.com" required></div>
<div><label for="guests">Number of attendees</label><select id="guests" name="guests" required><option value="">Select number</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
<div><label for="competition">Interested in competitions?</label><select id="competition" name="competition"><option>Yes</option><option>No</option></select></div>
<div class="full"><label for="message">Message (optional)</label><textarea id="message" name="message" placeholder="Write a message..."></textarea></div>
</div>
<button type="submit">Submit RSVP ↗</button>
</form>
</section>
</main>
<footer><a class="brand" href="index.html"><span class="brand-mark">✦</span><span>Spring Festival</span></a><p>Event invitation website · Student project by Muhammad Jawad Ahmad</p></footer>
<script src="script.js"></script>
</body>
</html>
